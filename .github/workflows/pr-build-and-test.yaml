name: pr-build-and-test

on:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet clean Icod.Path.sln -c Staging
      - run: dotnet restore Icod.Path.sln
      - run: dotnet build Icod.Path.sln -c Staging --no-restore
      - run: dotnet test Icod.Path.sln -c Staging --no-build --logger trx