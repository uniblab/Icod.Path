name: distribution-validation

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Staging
          - Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSIONS: |
    7.0.x
    8.0.x
    9.0.x
    10.0.x

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            verify_packages: false
          - os: windows-11-arm
            name: Windows ARM64
            verify_packages: false
          - os: ubuntu-24.04
            name: Linux x64
            verify_packages: true
          - os: ubuntu-24.04-arm
            name: Linux ARM64
            verify_packages: false
          - os: macos-15-intel
            name: macOS x64
            verify_packages: false
          - os: macos-15
            name: macOS ARM64
            verify_packages: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}
      - name: Verify distribution with package validation
        if: matrix.verify_packages
        shell: pwsh
        run: >-
          ./packaging/VerifyDistribution.ps1
          -Configuration '${{ inputs.configuration }}'
      - name: Verify build and tests
        if: ${{ !matrix.verify_packages }}
        shell: pwsh
        run: >-
          ./packaging/VerifyDistribution.ps1
          -Configuration '${{ inputs.configuration }}'
          -SkipPackageValidation
